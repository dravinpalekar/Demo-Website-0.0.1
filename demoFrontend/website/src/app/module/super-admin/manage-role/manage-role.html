<div class="row">
    <div class="col-xl-12">
        <div class="card card-default">
            <div class="card-body">

                <mat-form-field appearance="outline" class="custom-search">
                    <mat-label>Search</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Search records">
                </mat-form-field>


                <table mat-table [dataSource]="dataSource" matSort>

                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                        <td mat-cell *matCellDef="let element let i = index"> {{ getRowNumber(i) }}</td>
                    </ng-container>

                    <ng-container matColumnDef="roleName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Role Name</th>
                        <td mat-cell *matCellDef="let element">{{element.name}}</td>
                    </ng-container>

                    <ng-container matColumnDef="created">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
                        <td mat-cell *matCellDef="let element">{{element.createdAt }}</td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>

                <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 15]" showFirstLastButtons>
                </mat-paginator>

            </div>
        </div>
    </div>
</div>
